<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | น้ำผึ้งเดือนห้า</title>
  <meta name="description" content="สั่งซื้อน้ำผึ้งเดือนห้า กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">น้ำผึ้งเดือนห้า</a>
      <nav aria-label="เมนูหลัก">
        <ul class="site-nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>สั่งซื้อ</h1>
        <p>กรอกข้อมูลด้านล่างแล้วกดยืนยันสั่งซื้อ</p>
      </div>
    </section>

    <section class="section section--flush">
      <div class="container">

        <form id="orderForm" class="order-form">

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ (ไม่บังคับ)</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
            <p class="back-link"><a href="product.html">กลับไปเลือกสินค้า</a></p>
          </div>

        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>น้ำผึ้งเดือนห้า (Namphueng Duean Ha)</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
